[project]
name = "skutruth"
version = "0.1.0"
description = "Evidence-grounded product intelligence for industrial commerce (UniHack 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Vertex AI structured extraction (skutruth.extraction.vertex). Verified against
    # 2.18.1: Client(vertexai=True), Part.from_bytes, response_schema, usage_metadata.
    "google-genai>=2.18,<3",
    # Agent Search basic website search (skutruth.discovery.agent_search). Verified
    # against 0.20.2: SearchServiceClient, SearchRequest(serving_config, query,
    # page_size, filter). Discovery uses this and never a generative model client.
    "google-cloud-discoveryengine>=0.13,<1",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "pypdf>=6.0",
    # Structured table extraction fallback (skutruth.ingest.tables). MIT, as is its
    # pdfminer.six backend; deliberately not PyMuPDF, which is AGPL-or-commercial.
    "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/skutruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
