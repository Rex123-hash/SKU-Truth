# NOT ORGANIZER DATA — see `authority` below.
#
# Manufacturer-domain associations used by source discovery. The organizer pack contains
# no manufacturer or brand master, so nothing here comes from Unilog and nothing here
# should be described as approved by them.
#
# `authority = "REVIEWED"` means a person checked that each manufacturer publishes from
# each listed domain. That is a checkable fact about domain ownership, and it is why a
# REVIEWED registry may license evidence. It is NOT a claim about Unilog's catalogue
# rules, and `is_authoritative` stays false.
#
# ## A review is only worth what its record says
#
# An entry licenses evidence ONLY if it carries a `[manufacturer.review]` block naming
# who checked it, when, and on what basis. Without one it is locator-grade: it still
# builds queries, and anything found through it is UNVERIFIED_MANUFACTURER.
#
# **Three entries are reviewed: `kichler-lighting`, `satco-products`, and
# `feit-electric`.** Everything else
# below licenses nothing. That is the honest state, not a gap to be papered over. The
# unreviewed domains were written from general knowledge while building the discovery
# engine; nobody has verified them against the manufacturers' own publications. They stay
# because they are useful for locating candidates, and they are marked for exactly what
# they are.
#
# ## Evidence available for review is not a review
#
# The Schneider entry is the case worth being careful about. The local artifact store does
# hold documents fetched from those hosts with URLs and byte hashes recorded, and
# `research/lc1d18_artifact_note.md` preserves that lineage in committed form. A reviewer
# could use it. Nobody has.
#
# A `[manufacturer.review]` block is an affirmative audit event — a named person checked
# and says so. It is never inferred from repository state, from artifacts existing, from
# git authorship, or from an automated run having looked at files. Those establish
# material that CAN be reviewed; they do not establish that anyone DID.
#
# ## Promoting an entry
#
# 1. open the manufacturer's own site and confirm it publishes from each listed domain;
# 2. add `[manufacturer.review]` with `reviewed_at`, your own `reviewed_by`, and a
#    `basis` naming what you checked;
# 3. the entry then licenses evidence.
#
# Step 2 is a human signing their name to a claim. Nothing automated may do it for them.
#
# ## Two kinds of hint, and only one of them grants ownership
#
# `authority_hints` — reviewed as genuinely naming this manufacturer. Differences from
# the key are case, punctuation, or corporate form: `Makita Usa Inc` reduces to `Makita`
# under the documented suffix rule. These may produce APPROVED_MANUFACTURER.
#
# `locator_hints` — spellings observed in the organizer input that are *plausibly* this
# manufacturer and have not been confirmed. They help build search queries and can never
# grant ownership. A candidate found through one is classified UNVERIFIED_MANUFACTURER
# and cannot be stored as that manufacturer's evidence.
#
# The split exists because the approved manufacturer master is missing. Deciding that
# `Black & Decker/dewlt` *is* DeWalt is precisely the canonicalisation that file would
# authorise; asserting it here, as a side effect of a domain lookup, would smuggle the
# decision in without the evidence. Nothing here rewrites the input spelling either way.

name = "manufacturer-domains-demo"
authority = "REVIEWED"

# -- manufacturers ---------------------------------------------------------------

[[manufacturer]]
key = "schneider-electric"
authority_hints = ["Schneider Electric", "Schneider"]
domains = ["se.com", "schneider-electric.com"]
note = """
The LC1D18P7 engineering example. download.se.com serves datasheets and is covered as a
subdomain of se.com. `squared.com` and `schneider-electric.co.uk` were dropped from an
earlier draft: plausible, and not evidenced by anything here.

NOT REVIEWED, deliberately. There IS material a reviewer could examine — the local
artifact store holds documents fetched from these hosts with their URLs and byte hashes
recorded, and research/lc1d18_artifact_note.md preserves that lineage in committed form
(the manufacturer PDFs themselves are gitignored and stay that way). But evidence being
available for review is not a review. No person has confirmed that Schneider Electric
owns these hosts and signed their name to it, so this entry licenses nothing.

An earlier revision of this file attributed a review to a named person who had not
performed one, inferred from git authorship. That is precisely the assertion DomainReview
exists to refuse, and removing it is the point of the mechanism working.
"""

# -- reviewed and unreviewed entries -----------------------------------------------
#
# An entry carrying a `[manufacturer.review]` block licenses evidence; every other entry
# here builds queries and licenses nothing. Adding that block after genuinely checking
# the domains is what promotes one.

[[manufacturer]]
key = "kichler-lighting"
authority_hints = ["Kichler Lighting", "Kichler"]
domains = ["kichler.com"]
note = "Appears in the organizer input as `Kichler Lighting (KICLI)`. Reviewed — see the review block below."

[manufacturer.review]
reviewed_at = "2026-08-21"
reviewed_by = "Amaan Khan"
