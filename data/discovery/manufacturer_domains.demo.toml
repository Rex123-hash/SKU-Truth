# NOT ORGANIZER DATA — see `authority` below.
#
# Manufacturer-domain associations used by source discovery. The organizer pack contains
# no manufacturer or brand master, so nothing here comes from Unilog and nothing here
# should be described as approved by them.
#
# `authority = "REVIEWED"` means a person checked that each manufacturer publishes from
# each listed domain. That is a checkable fact about domain ownership, and it is why a
# REVIEWED registry may license evidence. It is NOT a claim about Unilog's catalogue
# rules, and `is_authoritative` stays false.
#
# ## A review is only worth what its record says
#
# An entry licenses evidence ONLY if it carries a `[manufacturer.review]` block naming
# who checked it, when, and on what basis. Without one it is locator-grade: it still
# builds queries, and anything found through it is UNVERIFIED_MANUFACTURER.
#
# Most entries below have no review block, and that is the honest state. Their domains
# were written from general knowledge while building the discovery engine — nobody in
# this project verified them against the manufacturers' own publications, and an
# unrecorded check cannot license a fact. They stay because they are useful for locating
# candidates, and they are marked for exactly what they are.
#
# **Exactly one entry has a genuine, checkable basis**: Schneider Electric, where this
# repository holds three ingested artifacts fetched from those hosts, with their URLs and
# hashes recorded, plus `research/lc1d18_artifact_note.md` documenting the
# `download.schneider-electric.com -> download.se.com` redirect. That is evidence a
# reviewer can re-examine without leaving the repo.
#
# ## Two kinds of hint, and only one of them grants ownership
#
# `authority_hints` — reviewed as genuinely naming this manufacturer. Differences from
# the key are case, punctuation, or corporate form: `Makita Usa Inc` reduces to `Makita`
# under the documented suffix rule. These may produce APPROVED_MANUFACTURER.
#
# `locator_hints` — spellings observed in the organizer input that are *plausibly* this
# manufacturer and have not been confirmed. They help build search queries and can never
# grant ownership. A candidate found through one is classified UNVERIFIED_MANUFACTURER
# and cannot be stored as that manufacturer's evidence.
#
# The split exists because the approved manufacturer master is missing. Deciding that
# `Black & Decker/dewlt` *is* DeWalt is precisely the canonicalisation that file would
# authorise; asserting it here, as a side effect of a domain lookup, would smuggle the
# decision in without the evidence. Nothing here rewrites the input spelling either way.

name = "manufacturer-domains-demo"
authority = "REVIEWED"

# -- manufacturers ---------------------------------------------------------------

[[manufacturer]]
key = "schneider-electric"
authority_hints = ["Schneider Electric", "Schneider"]
domains = ["se.com", "schneider-electric.com"]
note = """
The LC1D18P7 engineering example. download.se.com serves datasheets and is covered as a
subdomain of se.com. `squared.com` and `schneider-electric.co.uk` were dropped from an
earlier draft of this file: plausible, and not evidenced by anything in this repository.
"""

[manufacturer.review]
reviewed_at = "2026-08-17"
reviewed_by = "Amaan Khan"
basis = """
Three artifacts in this repository were fetched from these hosts and ingested with their
URLs and byte hashes recorded: LC1D18P7_DATASHEET and LC1D18_DATASHEET from
download.se.com, and the B8 Contactors catalogue requested from
download.schneider-electric.com and served by download.se.com. See
research/lc1d18_artifact_note.md, which records that redirect.
"""
note = """
Verifies domain ownership only. It says nothing about which products these hosts cover —
that stays with identity resolution — and nothing about Unilog's catalogue rules.
"""

# -- unreviewed entries: locator-grade until someone checks them -------------------
#
# Everything below builds queries and licenses nothing. Adding a `[manufacturer.review]`
# block after genuinely checking the domains is what promotes one.

[[manufacturer]]
key = "kichler-lighting"
authority_hints = ["Kichler Lighting", "Kichler"]
domains = ["kichler.com"]
note = "Appears in the organizer input as `Kichler Lighting (KICLI)`. Domain unverified."

[[manufacturer]]
key = "signify-philips-lighting"
authority_hints = ["Philips Lighting", "Signify"]
locator_hints = ["Phillips Lighting"]
domains = ["lighting.philips.com", "signify.com", "usa.lighting.philips.com"]
note = """
The organizer input spells this `Phillips Lighting` on 111 rows — two Ls, which is not a
corporate-form difference but a different word. It is almost certainly Philips, and
`almost certainly` is not a licence to publish under Philips' name, so it is a locator
hint: those rows still generate site-restricted queries, and anything found through them
is UNVERIFIED_MANUFACTURER until the manufacturer master says otherwise.
"""

[[manufacturer]]
key = "trex"
authority_hints = ["Trex", "Trex Company"]
domains = ["trex.com"]
note = "Decking. 159 decking rows in the organizer sample, concentrated here and TimberTech."

[[manufacturer]]
key = "timbertech"
authority_hints = ["TimberTech", "AZEK"]
domains = ["timbertech.com", "azekco.com"]

[[manufacturer]]
key = "makita"
authority_hints = ["Makita", "Makita Usa Inc", "Makita USA"]
domains = ["makitatools.com", "makita.com"]
note = """
`Makita Usa Inc` reduces to `makita` under the documented suffix rule — a corporate-form
difference, not a different name — so it is an authority hint rather than a locator one.
"""

[[manufacturer]]
key = "dewalt"
authority_hints = ["DeWalt"]
locator_hints = ["Black & Decker/dewlt", "Black and Decker"]
domains = ["dewalt.com"]
note = """
`Black & Decker/dewlt` on 55 organizer rows names a parent company and a misspelling of a
brand, joined by a slash. Whether those rows are DeWalt products, Black & Decker products,
or a supplier's shorthand for both is exactly what the missing manufacturer master would
settle. Locator only.
"""

[[manufacturer]]
key = "3m"
authority_hints = ["3M", "3M Company"]
domains = ["3m.com"]

[[manufacturer]]
key = "freud"
authority_hints = ["Freud", "Freud Inc"]
domains = ["freudtools.com"]

# -- hosts that may locate a source but never license a fact -----------------------
#
# These are not blocklists in a security sense. A distributor page may be a perfectly
# accurate description of a product; it is simply not the manufacturer's own publication,
# so it cannot be the source a specification is verified against.

[hosts]
marketplaces = [
    "amazon.com",
    "amazon.co.uk",
    "ebay.com",
    "walmart.com",
    "aliexpress.com",
    "etsy.com",
    "temu.com",
]

distributors = [
    "grainger.com",
    "mcmaster.com",
    "rs-online.com",
    "digikey.com",
    "mouser.com",
    "newark.com",
    "farnell.com",
    "homedepot.com",
    "lowes.com",
    "zoro.com",
    "globalindustrial.com",
]

# Datasheet mirrors and scraped aggregators. They frequently carry a real manufacturer
# PDF, and they are still refused: the copy cannot be shown to be unaltered, and the
# whole point of hashing an artifact is that we know what we read.
blocked = [
    "datasheetarchive.com",
    "alldatasheet.com",
    "datasheets360.com",
    "pdf1.alldatasheet.com",
]
